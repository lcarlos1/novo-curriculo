<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página de formação acadêmica - Luiz Carlos dos Santos</title>
<style>
:root{--bg:#030712;--card:rgba(255,255,255,.06);--border:rgba(255,255,255,.12);--text:#e5e7eb;--muted:#9ca3af;--indigo:#6366f1;--violet:#8b5cf6;--emerald:#10b981}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Inter,Roboto,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(800px 400px at 80% -10%,rgba(99,102,241,.25),transparent),radial-gradient(700px 400px at 10% 110%,rgba(139,92,246,.2),transparent)}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:50;backdrop-filter:blur(16px);background:rgba(3,7,18,.7);border-bottom:1px solid var(--border)}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.head{display:flex;align-items:center;justify-content:space-between;height:72px;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,var(--indigo),var(--violet));display:grid;place-items:center;box-shadow:0 10px 30px rgba(99,102,241,.3)}
.logo svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2}
.title{font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--muted);margin-top:-2px}
.counter{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--border);font-variant-numeric:tabular-nums}
.btn-icon{width:36px;height:36px;display:grid;place-items:center;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--border);cursor:pointer}
main{padding:32px 0 80px}
.hero{position:relative;overflow:hidden;border-radius:28px;background:var(--card);border:1px solid var(--border);backdrop-filter:blur(16px);padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.hero-grid{display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center}
@media(max-width:820px){.hero-grid{grid-template-columns:1fr;text-align:center}.hero-actions{justify-self:center}}
.avatar{width:112px;height:112px;border-radius:50%;background:linear-gradient(135deg,var(--indigo),var(--violet));display:grid;place-items:center;font-weight:800;font-size:32px;color:#fff;box-shadow:0 15px 40px rgba(99,102,241,.35);position:relative;margin:0 auto;overflow:hidden;padding:0}
.badge-verified{position:absolute;right:-4px;bottom:-4px;width:28px;height:28px;border-radius:50%;background:var(--emerald);display:grid;place-items:center;border:3px solid #0b1220}
.badge-verified svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none}
.name{font-size:32px;font-weight:800;letter-spacing:-.02em;outline:none;border-radius:10px;padding:2px 6px;margin:-2px -6px}
.name:focus{box-shadow:0 0 0 2px rgba(99,102,241,.5);background:rgba(255,255,255,.05)}
.loc{display:flex;align-items:center;gap:6px;color:var(--muted);margin-top:6px;justify-content:flex-start}
@media(max-width:820px){.loc{justify-content:center}}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(16,185,129,.12);color:#6ee7b7;border:1px solid rgba(16,185,129,.25);font-size:12px;font-weight:600;margin-bottom:10px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:10px 16px;border-radius:14px;font-weight:600;border:1px solid var(--border);background:rgba(255,255,255,.06);cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:8px;color:var(--text)}
.btn:hover{transform:translateY(-1px);background:rgba(255,255,255,.1)}
.btn-primary{background:linear-gradient(135deg,var(--indigo),var(--violet));border:none;box-shadow:0 10px 30px rgba(99,102,241,.3);color:#fff}
.filters{display:flex;gap:8px;justify-content:center;margin:36px 0 24px;flex-wrap:wrap}
.filter{padding:8px 14px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.04);cursor:pointer;font-size:14px;color:var(--muted)}
.filter.active{background:#fff;color:#000;border-color:#fff}
.timeline{position:relative;max-width:860px;margin:0 auto}
.timeline::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,rgba(99,102,241,.5),transparent);transform:translateX(-1px)}
@media(max-width:900px){.timeline::before{left:20px}}
.card{position:relative;margin:28px 0}
.dot{position:absolute;left:50%;top:28px;width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,var(--indigo),var(--violet));display:grid;place-items:center;transform:translate(-50%,-50%);box-shadow:0 10px 30px rgba(99,102,241,.35);border:4px solid #030712;z-index:2}
.dot svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2}
@media(max-width:900px){.dot{left:20px;transform:translate(-50%,-50%)}}
.card-inner{width:calc(50% - 40px);background:var(--card);border:1px solid var(--border);border-radius:24px;padding:20px;backdrop-filter:blur(12px);box-shadow:0 10px 40px rgba(0,0,0,.3);cursor:pointer;transition:.25s}
.card:nth-child(odd) .card-inner{margin-left:auto}
.card:nth-child(even) .card-inner{margin-right:auto}
@media(max-width:900px){.card-inner{width:calc(100% - 60px);margin-left:60px!important}}
.card-inner:hover{transform:translateY(-3px);box-shadow:0 16px 50px rgba(0,0,0,.4);border-color:rgba(99,102,241,.4)}
.card-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.card-title{font-weight:700;font-size:18px;line-height:1.25}
.card-inst{color:var(--muted);font-size:14px;margin-top:2px}
.valid{font-size:11px;padding:4px 8px;border-radius:999px;background:rgba(16,185,129,.15);color:#6ee7b7;border:1px solid rgba(16,185,129,.3);white-space:nowrap}
.details{max-height:0;overflow:hidden;transition:max-height .35s ease}
.details.open{max-height:500px}
.divider{height:1px;background:var(--border);margin:14px 0}
.desc{color:#cbd5e1;font-size:14px;margin-bottom:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.link-btn{padding:9px 14px;border-radius:12px;background:linear-gradient(135deg,var(--indigo),var(--violet));color:#fff;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.qr-btn{padding:9px 14px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--border);font-size:14px;cursor:pointer}
.qr-box{margin-top:12px;padding:12px;border-radius:14px;background:rgba(0,0,0,.3);border:1px solid var(--border);display:none;width:fit-content}
.qr-box.show{display:block}
.qr-box img{width:150px;height:150px;border-radius:8px;background:#fff;padding:6px;display:block}
footer{border-top:1px solid var(--border);padding:24px 0;color:var(--muted);font-size:14px}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.light{--bg:#f8fafc;--card:rgba(255,255,255,.8);--border:rgba(0,0,0,.08);--text:#0f172a;--muted:#475569}
.light body::before{background:radial-gradient(800px 400px at 80% -10%,rgba(99,102,241,.15),transparent),radial-gradient(700px 400px at 10% 110%,rgba(139,92,246,.12),transparent)}
.light .dot{border-color:#f8fafc}
.light .filter.active{background:#0f172a;color:#fff;border-color:#0f172a}
.light .qr-box{background:#f1f5f9}
</style>
<style>html.light{--bg:#f8fafc;--card:rgba(0,0,0,.04);--border:rgba(0,0,0,.1);--text:#0f172a;--muted:#475569} html.light header{background:rgba(248,250,252,.85)}</style>
</head>

<script>
const dados = [
 {tipo:'graduacao', titulo:'Bacharelado em Administração', inst:'UNIFATECIE', url:'https://waeweb.unifatecie.edu.br/servlet/hwmlgnd?4751.4751.43c972bd732d', desc:'Diploma digital com validação oficial. Acesse o link ou escaneie o QR Code.'},
 {tipo:'graduacao', titulo:'Tecnólogo em Gestão de Recursos Humanos', inst:'UNOPAR', url:'https://diplomas.somosb4.com.br/validar/298.298.8eb0318ce910', desc:'Certificado digital validado pela instituição.'},
 {tipo:'pos', titulo:'Pós-graduação em Economia no Setor Público', inst:'Faculdade Iguaçu', url:'https://ava07.eduno.com.br/vmatricula/e4590c13-532e-4b4b-92f2-44571999a541/dsuedc', desc:'Especialização com certificação digital.'},
 {tipo:'pos', titulo:'Pós-graduação em Planejamento e Gestão', inst:'Faculdade Iguaçu', url:'https://ava07.eduno.com.br/vmatricula/d16edf9d-4a4f-4f46-b102-ebfc2d21dce7/dsuedc', desc:'Certificação digital disponível.'},
 {tipo:'pos', titulo:'Pós-graduação em Gestão de Crises e Conflito', inst:'Faculdade Iguaçu', url:'https://ava07.eduno.com.br/vmatricula/80b1b991-f57f-4780-bcde-cf26a13c2402/8192ef3ddda2b64134e0381f887beb82', desc:'Validação digital oficial.'},
 {tipo:'pos', titulo:'Pós-Graduação em Gestão de Cidades e Planejamento Urbano', inst:'Faculdade Iguaçu', url:'https://ava07.eduno.com.br/vmatricula/2d813f7f-1f1a-4df3-8264-8effc2e7462d/dsuedc', desc:'Certificado com QR Code de verificação.'},
];

const timeline = document.getElementById('timeline');
dados.forEach((d,i)=>{
  const card = document.createElement('article');
  card.className='card'; card.dataset.type=d.tipo;
  card.innerHTML = `
    <div class="dot"><svg viewBox="0 0 24 24"><path d="M12 14l9-5-9-5-9 5 9 5z"/><path d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479L12 21l-6.825-3.943a12.083 12.083 0 01.665-6.479L12 14z"/></svg></div>
    <div class="card-inner">
      <div class="card-head">
        <div>
          <div class="card-title">${d.titulo}</div>
          <div class="card-inst">${d.inst}</div>
        </div>
        <span class="valid">Validado</span>
      </div>
      <div class="details">
        <div class="divider"></div>
        <div class="desc">${d.desc}</div>
        <div class="actions">
          <a class="link-btn" href="${d.url}" target="_blank" rel="noopener">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg>
            Verificar Validade
          </a>
          <button class="qr-btn">Mostrar QR Code</button>
        </div>
        <div class="qr-box"><img loading="lazy" alt="QR Code" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(d.url)}"></div>
      </div>
    </div>`;
  timeline.appendChild(card);
});

// interações
document.querySelectorAll('.card-inner').forEach(el=>{
  el.addEventListener('click', e=>{
    if(e.target.closest('a')||e.target.closest('button')) return;
    el.querySelector('.details').classList.toggle('open');
  });
  const btn = el.querySelector('.qr-btn');
  const box = el.querySelector('.qr-box');
  btn.addEventListener('click', e=>{e.stopPropagation(); box.classList.toggle('show'); btn.textContent = box.classList.contains('show')?'Ocultar QR Code':'Mostrar QR Code';});
});

// filtros
document.querySelectorAll('.filter').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    const f=b.dataset.f;
    document.querySelectorAll('.card').forEach(c=>{c.style.display = (f==='todos'||c.dataset.type===f)?'':'none'});
  });
});

// tema
// nome
const nomeEl=document.getElementById('nome'), avatar=document.getElementById('avatar');
const updateAvatar=n=>{}; // avatar fixo com foto
const saved=localStorage.getItem('nomeAcademico') || 'Luiz Carlos dos Santos'; nomeEl.textContent=saved; updateAvatar(saved);
nomeEl.addEventListener('blur',()=>{const v=nomeEl.textContent.trim()||'Seu Nome Completo';nomeEl.textContent=v;localStorage.setItem('nomeAcademico',v);updateAvatar(v);});
nomeEl.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();nomeEl.blur()}});

// contador
// contador total (local, funciona offline)
let total = parseInt(localStorage.getItem('visitasTotal')||'0')+1; 
localStorage.setItem('visitasTotal', total);
document.getElementById('contador').textContent = new Intl.NumberFormat('pt-BR').format(total);
let v = parseInt(localStorage.getItem('visitaLocal')||'0')+1; localStorage.setItem('visitaLocal',v); document.getElementById('visita-local').textContent=`sua visita nº ${v}`;

// share
document.getElementById('share').onclick=async()=>{const data={title:'Página de formação acadêmica - Luiz Carlos dos Santos',text:'Confira meus diplomas validados',url:location.href};try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(location.href);alert('Link copiado!')}}catch{}};
</script>

<script>
const themeBtn=document.getElementById('theme');
const applyTheme = t=>{document.documentElement.classList.toggle('light', t==='light'); localStorage.setItem('theme',t); themeBtn.textContent=t==='light'?'☀️':'🌙';};
const savedTheme = localStorage.getItem('theme')||'dark';
applyTheme(savedTheme);
themeBtn.onclick=()=>{applyTheme(document.documentElement.classList.contains('light')?'dark':'light');};
</script>
