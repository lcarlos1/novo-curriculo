/* ═══════════════════════════════════════════════════════════
   MODERNIZATIONS — Scroll Animations, Print, Mobile, A11y
   ═══════════════════════════════════════════════════════════ */

/* --- Skeleton Loading --- */
.skeleton-pulse{animation:skeletonPulse 1.8s ease-in-out infinite;opacity:.6}
@keyframes skeletonPulse{0%,100%{opacity:.4}50%{opacity:.8}}

/* --- Scroll Reveal Animations --- */
.reveal{opacity:0;transform:translateY(28px);transition:opacity .7s cubic-bezier(.22,1,.36,1),transform .7s cubic-bezier(.22,1,.36,1)}
.reveal.visible{opacity:1;transform:translateY(0)}
.reveal-left{opacity:0;transform:translateX(-28px);transition:opacity .7s cubic-bezier(.22,1,.36,1),transform .7s cubic-bezier(.22,1,.36,1)}
.reveal-left.visible{opacity:1;transform:translateX(0)}
.reveal-right{opacity:0;transform:translateX(28px);transition:opacity .7s cubic-bezier(.22,1,.36,1),transform .7s cubic-bezier(.22,1,.36,1)}
.reveal-right.visible{opacity:1;transform:translateX(0)}
.reveal-scale{opacity:0;transform:scale(.92);transition:opacity .6s cubic-bezier(.22,1,.36,1),transform .6s cubic-bezier(.22,1,.36,1)}
.reveal-scale.visible{opacity:1;transform:scale(1)}
.stagger-1{transition-delay:.08s}.stagger-2{transition-delay:.16s}.stagger-3{transition-delay:.24s}.stagger-4{transition-delay:.32s}

/* --- Animated Skill Bars --- */
.skill-bar-fill{width:0!important;transition:width 1.4s cubic-bezier(.22,1,.36,1)}
.skill-bar-fill.visible{width:var(--bar-width)!important}

/* --- Animated Counters --- */
.counter-animate{display:inline-block}

/* --- Floating Gradient Orbs --- */
@keyframes floatOrb1{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(30px,-20px) scale(1.05)}50%{transform:translate(-15px,25px) scale(.95)}75%{transform:translate(20px,10px) scale(1.02)}}
@keyframes floatOrb2{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(-25px,15px) scale(1.08)}66%{transform:translate(20px,-30px) scale(.92)}}
.floating-orb{position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none;will-change:transform}
.floating-orb-1{animation:floatOrb1 18s ease-in-out infinite}
.floating-orb-2{animation:floatOrb2 22s ease-in-out infinite}

/* --- Mobile Hamburger Menu --- */
.mobile-menu-btn{display:none;width:44px;height:44px;align-items:center;justify-content:center;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);cursor:pointer;transition:all .2s}
.mobile-menu-btn:hover{background:rgba(255,255,255,.1)}
.mobile-menu-btn svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
.mobile-nav{display:none;position:fixed;top:64px;left:0;right:0;z-index:50;padding:12px 16px;backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.08);animation:slideDown .25s ease}
.mobile-nav.open{display:flex;flex-direction:column;gap:4px}
.mobile-nav a{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;font-size:14px;font-weight:600;color:inherit;text-decoration:none;transition:background .15s;min-height:44px}
.mobile-nav a:hover{background:rgba(255,255,255,.08)}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:767px){
  .mobile-menu-btn{display:flex}
  nav.hidden.md\:flex{display:none!important}
}

/* --- Touch-Friendly Targets --- */
button,a{min-height:44px;min-width:44px}
@media(max-width:640px){
  button,a{min-height:44px}
  .rounded-full{border-radius:9999px}
}

/* --- Smooth Scroll --- */
html{scroll-behavior:smooth}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .reveal,.reveal-left,.reveal-right,.reveal-scale{transition:none!important;opacity:1!important;transform:none!important}
  .skill-bar-fill{transition:none!important}
  .floating-orb{animation:none!important}
  *{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important}
}

/* --- Focus Visible for Accessibility --- */
:focus-visible{outline:2px solid #7c3aed;outline-offset:2px;border-radius:8px}
button:focus-visible,a:focus-visible{outline:2px solid #7c3aed;outline-offset:2px}

/* --- Print Stylesheet --- */
@media print{
  body{background:white!important;color:#111!important}
  .fixed,.sticky{position:static!important}
  header,nav,.mobile-menu-btn,.floating-orb,canvas{display:none!important}
  .reveal,.reveal-left,.reveal-right,.reveal-scale{opacity:1!important;transform:none!important;transition:none!important}
  section{page-break-inside:avoid}
  a{color:#111;text-decoration:underline}
  *{box-shadow:none!important;text-shadow:none!important}
  .bg-gradient-to-br,.bg-gradient-to-r{background:#7c3aed!important;color:white!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* --- Dark mode hamburger override --- */
html:not(.dark) .mobile-menu-btn{border-color:rgba(0,0,0,.08);background:white}
html:not(.dark) .mobile-nav{background:rgba(255,255,255,.92);border-bottom-color:rgba(0,0,0,.06)}
html:not(.dark) .mobile-nav a:hover{background:rgba(0,0,0,.04)}

/* --- Swipe hint for presentation --- */
@media(max-width:767px){
  .presentation-hint{display:block!important;font-size:11px;opacity:.5;text-align:center;padding:8px}

  <script>
// ═══════════════════════════════════════════════════════════
// MODERNIZATION JS — Theme, Animations, Mobile, Touch
// ═══════════════════════════════════════════════════════════

(function(){
  'use strict';

  // --- 1. System Theme Detection ---
  const savedTheme = localStorage.getItem('portfolio-theme');
  if(!savedTheme && window.matchMedia){
    const mq = window.matchMedia('(prefers-color-scheme: light)');
    if(mq.matches) document.documentElement.classList.add('dark-mode-init');
    mq.addEventListener('change', e => {
      if(!localStorage.getItem('portfolio-theme')){
        document.documentElement.classList.toggle('dark', !e.matches);
      }
    });
  }

  // --- 2. Intersection Observer for Scroll Reveal ---
  function initScrollReveal(){
    const sections = document.querySelectorAll('section, [id]');
    const cards = document.querySelectorAll('[class*="rounded-"]');
    
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if(entry.isIntersecting){
          entry.target.classList.add('visible');
          // Don't unobserve - allow re-animation if needed
        }
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

    // Add reveal classes to sections
    document.querySelectorAll('section').forEach((el, i) => {
      el.classList.add('reveal');
      el.style.transitionDelay = (i * 0.06) + 's';
      observer.observe(el);
    });

    // Add reveal to cards in grids
    document.querySelectorAll('.grid > div, [class*="grid"] > div').forEach((el, i) => {
      if(!el.closest('header') && !el.closest('nav')){
        el.classList.add('reveal-scale');
        el.style.transitionDelay = (i % 6) * 0.06 + 's';
        observer.observe(el);
      }
    });
  }

  // --- 3. Animated Counters ---
  function initCounters(){
    const counterObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if(entry.isIntersecting && !entry.target.dataset.counted){
          entry.target.dataset.counted = 'true';
          animateCounter(entry.target);
        }
      });
    }, { threshold: 0.5 });

    document.querySelectorAll('.counter-animate').forEach(el => counterObserver.observe(el));
  }

  function animateCounter(el){
    const text = el.textContent.trim();
    const match = text.match(/^([\d.]+)(.*)$/);
    if(!match) return;
    
    const target = parseFloat(match[1].replace(/\./g, ''));
    const suffix = match[2];
    const duration = 1200;
    const start = performance.now();
    const isFloat = match[1].includes('.');
    
    function update(now){
      const elapsed = now - start;
      const progress = Math.min(elapsed / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3); // ease-out cubic
      const current = Math.floor(target * eased);
      
      if(target > 999){
        el.textContent = current.toLocaleString('pt-BR') + suffix;
      } else {
        el.textContent = (isFloat ? (target * eased).toFixed(1) : current) + suffix;
      }
      
      if(progress < 1) requestAnimationFrame(update);
    }
    requestAnimationFrame(update);
  }

  // --- 4. Skill Bar Animation ---
  function initSkillBars(){
    const barObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if(entry.isIntersecting){
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.3 });

    document.querySelectorAll('[class*="bg-gradient"][class*="rounded-full"][class*="h-"]').forEach(el => {
      const parent = el.parentElement;
      if(parent && getComputedStyle(parent).overflow === 'hidden'){
        el.classList.add('skill-bar-fill');
        el.style.setProperty('--bar-width', el.style.width || getComputedStyle(el).width);
        barObserver.observe(el);
      }
    });
  }

  // --- 5. Mobile Hamburger Menu ---
  function initMobileMenu(){
    const header = document.querySelector('header');
    if(!header) return;
    
    const nav = header.querySelector('nav');
    if(!nav) return;

    // Create hamburger button
    const btn = document.createElement('button');
    btn.className = 'mobile-menu-btn';
    btn.setAttribute('aria-label', 'Abrir menu de navegação');
    btn.setAttribute('aria-expanded', 'false');
    btn.innerHTML = '<svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>';

    // Create mobile nav
    const mobileNav = document.createElement('div');
    mobileNav.className = 'mobile-nav';
    mobileNav.setAttribute('role', 'navigation');
    mobileNav.setAttribute('aria-label', 'Menu principal');
    
    const links = nav.querySelectorAll('a');
    links.forEach(link => {
      const clone = link.cloneNode(true);
      clone.style.minHeight = '44px';
      clone.style.display = 'flex';
      clone.style.alignItems = 'center';
      mobileNav.appendChild(clone);
    });

    // Toggle
    btn.addEventListener('click', () => {
      const isOpen = mobileNav.classList.contains('open');
      mobileNav.classList.toggle('open');
      btn.setAttribute('aria-expanded', !isOpen);
      btn.setAttribute('aria-label', isOpen ? 'Abrir menu' : 'Fechar menu');
      
      // Animate hamburger to X
      const lines = btn.querySelectorAll('line');
      if(!isOpen){
        lines[0].style.transform = 'rotate(45deg) translate(5px, 5px)';
        lines[1].style.opacity = '0';
        lines[2].style.transform = 'rotate(-45deg) translate(5px, -5px)';
      } else {
        lines[0].style.transform = '';
        lines[1].style.opacity = '';
        lines[2].style.transform = '';
      }
    });

    // Close on link click
    mobileNav.addEventListener('click', (e) => {
      if(e.target.tagName === 'A'){
        mobileNav.classList.remove('open');
        btn.setAttribute('aria-expanded', 'false');
        const lines = btn.querySelectorAll('line');
        lines[0].style.transform = '';
        lines[1].style.opacity = '';
        lines[2].style.transform = '';
      }
    });

    // Close on outside click
    document.addEventListener('click', (e) => {
      if(!btn.contains(e.target) && !mobileNav.contains(e.target)){
        mobileNav.classList.remove('open');
        btn.setAttribute('aria-expanded', 'false');
      }
    });

    // Insert into header
    const headerRight = header.querySelector('.flex.items-center.gap-2');
    if(headerRight) headerRight.prepend(btn);
    document.body.appendChild(mobileNav);
  }

  // --- 6. Touch Swipe for Presentation Mode ---
  function initSwipeGestures(){
    let touchStartX = 0;
    let touchStartY = 0;
    
    document.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      
      // Only trigger if horizontal swipe is dominant
      if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 60){
        const presentationModal = document.querySelector('[class*="fixed"][class*="inset-0"][class*="z-[70]"]');
        if(presentationModal){
          if(dx < 0){
            // Swipe left -> next (simulate right arrow)
            document.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight' }));
          } else {
            // Swipe right -> prev (simulate left arrow)
            document.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowLeft' }));
          }
        }
      }
    }, { passive: true });
  }

  // --- 7. Floating Gradient Orbs ---
  function initFloatingOrbs(){
    const bg = document.querySelector('.fixed.inset-0.-z-10');
    if(!bg) return;
    
    const orb1 = document.createElement('div');
    orb1.className = 'floating-orb floating-orb-1';
    orb1.style.cssText = 'width:400px;height:400px;background:rgba(124,58,237,0.15);top:10%;left:5%;';
    
    const orb2 = document.createElement('div');
    orb2.className = 'floating-orb floating-orb-2';
    orb2.style.cssText = 'width:350px;height:350px;background:rgba(34,211,238,0.12);bottom:15%;right:10%;';
    
    bg.appendChild(orb1);
    bg.appendChild(orb2);
  }

  // --- 8. Add ARIA Labels ---
  function initAccessibility(){
    // Add lang attribute
    document.documentElement.setAttribute('lang', 'pt-BR');
    
    // Add aria-labels to interactive elements
    document.querySelectorAll('button').forEach(btn => {
      if(!btn.getAttribute('aria-label') && !btn.textContent.trim()){
        btn.setAttribute('aria-label', 'Botão');
      }
    });

    // Add role attributes
    document.querySelectorAll('[id="root"]').forEach(el => {
      el.setAttribute('role', 'main');
    });
  }

  // --- 9. Keyboard shortcut hints ---
  function initKeyboardHints(){
    document.addEventListener('keydown', (e) => {
      // Ctrl+K for search (already exists in React)
      // Add arrow key navigation for presentation mode
      if(e.key === 'Escape'){
        // Close any open mobile menu
        document.querySelectorAll('.mobile-nav.open').forEach(nav => {
          nav.classList.remove('open');
        });
      }
    });
  }

  // --- Initialize Everything ---
  function init(){
    // Wait for React to render
    setTimeout(() => {
      initMobileMenu();
      initScrollReveal();
      initCounters();
      initSkillBars();
      initSwipeGestures();
      initFloatingOrbs();
      initAccessibility();
      initKeyboardHints();
    }, 800);
    
    // Re-init after dynamic content changes (for SPA-like behavior)
    let lastUrl = location.href;
    const urlObserver = new MutationObserver(() => {
      if(location.href !== lastUrl){
        lastUrl = location.href;
        setTimeout(() => {
          initScrollReveal();
          initSkillBars();
        }, 300);
      }
    });
    urlObserver.observe(document.body, { childList: true, subtree: true });
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
